name: roadtosmartbaking-next

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rtsm
      POSTGRES_USER: rtsm
      POSTGRES_PASSWORD: ${RTSM_DB_PASSWORD:-rtsm_local_only}
    ports:
      - "127.0.0.1:${RTSM_DB_PORT:-5434}:5432"
    volumes:
      - rtsm_next_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rtsm", "-d", "rtsm"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  rtsm_next_postgres:
